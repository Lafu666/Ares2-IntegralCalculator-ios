name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print environment
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcrun xcodebuild archive \
            -project AresPointsCalculator.xcodeproj \
            -scheme AresPointsCalculator \
            -configuration Release \
            -archivePath build/AresPointsCalculator.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/build-archive.log

      - name: Verify archive
        run: |
          ls -la build/AresPointsCalculator.xcarchive/Products/Applications/
          find build/AresPointsCalculator.xcarchive -name "*.app" | head -3

      - name: Package IPA manually (unsigned)
        run: |
          # 直接手动打包，绕过 xcodebuild -exportArchive 的签名要求
          rm -rf build/Payload build/ipa-output
          mkdir -p build/Payload build/ipa-output

          APP_PATH=$(find build/AresPointsCalculator.xcarchive/Products/Applications -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip --symlinks -r ipa-output/AresPointsCalculator.ipa Payload
          cd ..
          ls -la build/ipa-output/

      - name: Verify IPA
        run: |
          ls -la build/ipa-output/AresPointsCalculator.ipa
          unzip -l build/ipa-output/AresPointsCalculator.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AresPointsCalculator-iOS15-18
          path: build/ipa-output/AresPointsCalculator.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/build-archive.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa-output/AresPointsCalculator.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
