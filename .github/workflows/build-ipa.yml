name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (iOS 17 SDK)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          echo "---SDKs---"
          xcodebuild -showsdks | grep -i ios || true
          echo "---xcodegen---"
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        id: archive
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project Ares2Calc.xcodeproj \
            -scheme Ares2Calc \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Ares2Calc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/build.log
          echo "archive_exit_code=\({PIPESTATUS[0]}" >> \)GITHUB_OUTPUT

      - name: If archive failed, dump last 120 lines of log
        if: steps.archive.outcome == 'failure' || steps.archive.outputs.archive_exit_code != '0'
        run: |
          echo "❌ Archive failed (exit code: ${{ steps.archive.outputs.archive_exit_code }})"
          echo "==================== last 120 lines of build.log ===================="
          tail -120 build/build.log || true
          echo "===================================================================="
          exit 1

      - name: Verify archive product exists
        run: |
          APP_PATH="build/Ares2Calc.xcarchive/Products/Applications/Ares2Calc.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Archive product not found at $APP_PATH"
            echo "----- xcarchive structure -----"
            find build/Ares2Calc.xcarchive -maxdepth 4 -type d 2>/dev/null || echo "no xcarchive directory"
            exit 1
          fi
          echo "✅ Archive OK: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Ares2Calc.xcarchive/Products/Applications/Ares2Calc.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          if [ -f "build/Payload/Ares2Calc.app/Ares2Calc" ]; then
            chmod +x "build/Payload/Ares2Calc.app/Ares2Calc"
          fi
          find "build/Payload/Ares2Calc.app" -type f -name "*.dylib" -exec chmod +x {} \; 2>/dev/null || true
          cd build
          zip -qry "Ares2Calc-unsigned.ipa" Payload
          mv "Ares2Calc-unsigned.ipa" "Ares2Calc.ipa"
          ls -la "Ares2Calc.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ares2Calc-iOS17-unsigned-ipa
          path: build/Ares2Calc.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
